<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Result Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>STUDENT RESULT MANAGER</h1>
      <div class="form-section">
        <input type="text" id="studentName" placeholder="Enter Student Name" />
        <input type="number" id="maths" placeholder="Maths Marks" />
        <input type="number" id="science" placeholder="Science Marks" />
        <input type="number" id="english" placeholder="English Marks" />
        <button id="addStudentBtn">Add Student</button>
      </div>

      <p class="message"></p>
      <h2>STUDENTS</h2>
      <div class="studentList"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
