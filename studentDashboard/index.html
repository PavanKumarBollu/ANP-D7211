<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a href="#" class="navbar-brand">StudentHub</a>
            <div>
                <a href="#" class="text-white me-3">Dashboard</a>
                <a href="#" class="text-white me-3">Course</a>
                <a href="#" class="text-white">Profile</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h2>Welcome back, Pavan! 👋</h2>
        <p>Here's what's happening with your learning.</p>
    </div>


    <div class="container">
        <div class="row g-3">
            <div class="col-md-3">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h6>Total Courses</h6>
                        <h2>6</h2>
                        <span class="badge bg-primary">Active</span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h6>Completed</h6>
                        <h2>2</h2>
                        <span class="badge bg-success">Great !</span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h6>In Progress</h6>
                        <h2>3</h2>
                        <span class="badge bg-warning text-dark">Keep Going</span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h6>In Assignmenet</h6>
                        <h2>4</h2>
                        <span class="badge bg-danger text-dark">Pending</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container mt-4">
        <h4>My Coureses</h4>
        <div class="row g-3 mt-1">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5>JavaScript</h5>
                        <p class="text-muted">Instructor:Pavan</p>
                        <div class="progress">
                            <div class="progress-bar" style="width: 75%;">75%</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>progress-bar





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
